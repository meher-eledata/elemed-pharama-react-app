name: CI

# Runs on every PR into a deployed serverless branch (dev/qa). Build + validate only —
# NO AWS credentials and NO deploy. The real deploy runs on push/merge (deploy-*.yml).
on:
  pull_request:
    branches: [dev, qa]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests (pass if none defined yet)
        run: npm test -- --passWithNoTests --watchAll=false
      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: /api/
